{% extends "base.html" %}
{% block title %}配置管理 - Infra Monitor{% endblock %}

{% block content %}
<h4 class="mb-3"><i class="bi bi-gear"></i> 配置管理</h4>

{% if saved %}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle"></i> 配置已保存！ZK 连接已重置，下次请求将使用新配置。
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}

<form method="post" action="/elasticsearch/config">
    <!-- ZooKeeper 配置 -->
    <div class="card mb-3">
        <div class="card-header"><i class="bi bi-tree"></i> ZooKeeper</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">连接地址</label>
                    <input type="text" class="form-control" name="zk_hosts"
                           value="{{ config.zookeeper.hosts }}" placeholder="127.0.0.1:2181">
                    <div class="form-text">多个地址用逗号分隔，如 host1:2181,host2:2181</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">连接超时（秒）</label>
                    <input type="number" class="form-control" name="zk_timeout"
                           value="{{ config.zookeeper.timeout }}" min="1" max="120">
                </div>
            </div>
        </div>
    </div>

    <!-- Elasticsearch 配置 -->
    <div class="card mb-3">
        <div class="card-header"><i class="bi bi-search"></i> Elasticsearch</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">连接地址</label>
                    <input type="text" class="form-control" name="es_url"
                           value="{{ config.elasticsearch.url }}" placeholder="http://127.0.0.1:9200">
                </div>
                <div class="col-md-4">
                    <label class="form-label">连接超时（秒）</label>
                    <input type="number" class="form-control" name="es_timeout"
                           value="{{ config.elasticsearch.timeout }}" min="1" max="120">
                </div>
            </div>
        </div>
    </div>

    <!-- 通用配置 -->
    <div class="card mb-3">
        <div class="card-header"><i class="bi bi-sliders"></i> 通用配置</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">自动刷新间隔（秒）</label>
                    <input type="number" class="form-control" name="refresh_interval"
                           value="{{ config.refresh_interval }}" min="5" max="300">
                </div>
            </div>
        </div>
    </div>

    <div class="text-end">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> 保存配置
        </button>
    </div>
</form>
{% endblock %}
