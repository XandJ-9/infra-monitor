{% extends "base.html" %}
{% block title %}ZooKeeper 监控 - Infra Monitor{% endblock %}

{% block content %}
<h4 class="mb-3"><i class="bi bi-tree"></i> ZooKeeper 监控</h4>

<!-- 连接管理 -->
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>连接管理</span>
        <button class="btn btn-sm btn-outline-secondary" type="button" onclick="resetZkConnectionForm()">
            <i class="bi bi-plus-lg"></i> 新增连接
        </button>
    </div>
    <div class="card-body">
        <div class="row g-3 align-items-end mb-3">
            <div class="col-md-5">
                <label class="form-label">当前集群</label>
                <select class="form-select" id="zk-active-connection" onchange="setActiveZkConnection(this.value)"></select>
            </div>
        </div>
        <form class="row g-2 align-items-end" id="zk-connection-form" onsubmit="saveZkConnection(event)">
            <input type="hidden" id="zk-connection-id">
            <div class="col-md-3">
                <label class="form-label">名称</label>
                <input type="text" class="form-control" id="zk-connection-name" placeholder="生产集群">
            </div>
            <div class="col-md-6">
                <label class="form-label">连接地址</label>
                <input type="text" class="form-control" id="zk-connection-hosts" placeholder="zk1:2181,zk2:2181" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">超时（秒）</label>
                <input type="number" class="form-control" id="zk-connection-timeout" min="1" max="120" value="10">
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary" title="保存">
                    <i class="bi bi-save"></i>
                </button>
            </div>
        </form>
        <div id="zk-connections-table" class="table-responsive mt-3"></div>
    </div>
</div>

<!-- 状态概览 -->
<div class="row g-3 mb-3">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">连接状态</div>
            <div id="zk-status-body" class="card-body">
                <p class="text-muted mb-0">
                    <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                    正在加载连接状态...
                </p>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">关键 Znode 监控</div>
            <div id="zk-key-nodes-body" class="card-body">
                <p class="text-muted mb-0">连接状态确认后加载关键节点</p>
            </div>
        </div>
    </div>
</div>

<!-- 集群节点 -->
<div class="card mb-3">
    <div class="card-header">集群节点</div>
    <div id="zk-servers-body" class="card-body p-0">
        <p class="text-muted p-3 mb-0">连接状态确认后加载集群节点</p>
    </div>
</div>

<!-- 节点树浏览器 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>节点树浏览器</span>
        <div class="input-group" style="max-width: 400px;">
            <input type="text" class="form-control form-control-sm" id="node-path-input" value="/" placeholder="输入路径，如 /brokers/ids">
            <button class="btn btn-sm btn-outline-primary" onclick="loadNode()">
                <i class="bi bi-search"></i> 查询
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <!-- 左侧：子节点列表 -->
            <div class="col-md-4">
                <h6>子节点</h6>
                <div id="children-list" class="border rounded p-2" style="min-height: 300px; max-height: 500px; overflow-y: auto;">
                    <p class="text-muted">点击查询加载节点信息</p>
                </div>
            </div>
            <!-- 右侧：节点详情 -->
            <div class="col-md-8">
                <h6>节点详情</h6>
                <div id="node-detail" class="border rounded p-3" style="min-height: 300px;">
                    <p class="text-muted">选择一个节点查看详情</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const ZK_KEY_PATHS = ['/controller', '/brokers', '/brokers/ids', '/brokers/topics', '/cluster', '/admin', '/config'];
let zkConnections = [];

async function loadZkConnections() {
    const data = await fetch(`${BASE_URL}/zookeeper/api/connections`).then((r) => r.json());
    zkConnections = data.connections || [];
    renderZkConnections(data.active);
}

function renderZkConnections(activeId) {
    const select = document.getElementById('zk-active-connection');
    select.innerHTML = zkConnections.map((conn) => `
        <option value="${escapeHtml(conn.id)}" ${conn.id === activeId ? 'selected' : ''}>
            ${escapeHtml(conn.name)} (${escapeHtml(conn.hosts)})
        </option>
    `).join('');

    const table = document.getElementById('zk-connections-table');
    if (!zkConnections.length) {
        table.innerHTML = '<p class="text-muted mb-0">暂无连接配置</p>';
        return;
    }
    table.innerHTML = `<table class="table table-sm align-middle mb-0">
        <thead><tr><th>名称</th><th>地址</th><th>超时</th><th>状态</th><th class="text-end">操作</th></tr></thead>
        <tbody>${zkConnections.map((conn) => `
            <tr>
                <td>
                    ${conn.active ? '<span class="badge bg-primary me-1">当前</span>' : ''}
                    ${escapeHtml(conn.name)}
                </td>
                <td><code>${escapeHtml(conn.hosts)}</code></td>
                <td>${escapeHtml(String(conn.timeout))}s</td>
                <td><span class="badge ${conn.connected ? 'bg-success' : 'bg-secondary'}">${conn.connected ? '已连接' : '未连接'}</span></td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" type="button" title="切换" onclick="setActiveZkConnection('${escapeJs(conn.id)}')" ${conn.active ? 'disabled' : ''}>
                        <i class="bi bi-check2-circle"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" type="button" title="编辑" onclick="editZkConnection('${escapeJs(conn.id)}')">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" type="button" title="删除" onclick="deleteZkConnection('${escapeJs(conn.id)}')" ${zkConnections.length <= 1 ? 'disabled' : ''}>
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('')}</tbody>
    </table>`;
}

function resetZkConnectionForm() {
    document.getElementById('zk-connection-id').value = '';
    document.getElementById('zk-connection-name').value = '';
    document.getElementById('zk-connection-hosts').value = '';
    document.getElementById('zk-connection-timeout').value = '10';
    document.getElementById('zk-connection-hosts').focus();
}

function editZkConnection(id) {
    const conn = zkConnections.find((item) => item.id === id);
    if (!conn) return;
    document.getElementById('zk-connection-id').value = conn.id;
    document.getElementById('zk-connection-name').value = conn.name || '';
    document.getElementById('zk-connection-hosts').value = conn.hosts || '';
    document.getElementById('zk-connection-timeout').value = conn.timeout || 10;
}

async function saveZkConnection(event) {
    event.preventDefault();
    const payload = {
        id: document.getElementById('zk-connection-id').value.trim(),
        name: document.getElementById('zk-connection-name').value.trim(),
        hosts: document.getElementById('zk-connection-hosts').value.trim(),
        timeout: Number(document.getElementById('zk-connection-timeout').value || 10),
    };
    const response = await fetch(`${BASE_URL}/zookeeper/api/connections`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '保存失败');
        return;
    }
    resetZkConnectionForm();
    await refreshZkPage();
}

async function setActiveZkConnection(id) {
    if (!id) return;
    const response = await fetch(`${BASE_URL}/zookeeper/api/connections/active`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '切换失败');
        return;
    }
    await refreshZkPage();
}

async function deleteZkConnection(id) {
    if (!confirm('删除这个 ZooKeeper 连接？')) return;
    const response = await fetch(`${BASE_URL}/zookeeper/api/connections/${encodeURIComponent(id)}`, {
        method: 'DELETE',
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '删除失败');
        return;
    }
    await refreshZkPage();
}

function renderZkStatus(info) {
    const body = document.getElementById('zk-status-body');
    if (!info.connected) {
        body.innerHTML = `
            <span class="badge bg-danger fs-6">未连接</span>
            <p class="mt-2 text-danger mb-0">${escapeHtml(info.error || '无法连接')}</p>`;
        return;
    }

    body.innerHTML = `
        <span class="badge bg-success fs-6">已连接</span>
        <p class="mt-2 mb-1"><strong>集群：</strong>${escapeHtml(info.cluster || '已连接')}</p>
        <p class="mb-0"><strong>版本：</strong>${escapeHtml(info.version || '-')}</p>`;
}

function setZkLazyMessage(message) {
    document.getElementById('zk-key-nodes-body').innerHTML = `<p class="text-muted mb-0">${message}</p>`;
    document.getElementById('zk-servers-body').innerHTML = `<p class="text-muted p-3 mb-0">${message}</p>`;
}

async function loadZkKeyNodes() {
    const body = document.getElementById('zk-key-nodes-body');
    body.innerHTML = '<p class="text-muted mb-0">正在加载关键节点...</p>';
    const nodes = await Promise.all(ZK_KEY_PATHS.map(async (path) => {
        const data = await fetch(`${BASE_URL}/zookeeper/api/exists?path=${encodeURIComponent(path)}`).then((r) => r.json());
        return { path, exists: Boolean(data.exists) };
    }));

    body.innerHTML = nodes.map((node) => `
        <div class="d-flex justify-content-between align-items-center py-1 border-bottom">
            <code>${escapeHtml(node.path)}</code>
            <span class="badge ${node.exists ? 'bg-success' : 'bg-secondary'}">${node.exists ? '存在' : '不存在'}</span>
        </div>
    `).join('');
}

async function loadZkServers() {
    const body = document.getElementById('zk-servers-body');
    body.innerHTML = '<p class="text-muted p-3 mb-0">正在加载集群节点...</p>';
    const servers = await fetch(`${BASE_URL}/zookeeper/api/servers`).then((r) => r.json());
    if (!servers.length) {
        body.innerHTML = '<p class="text-muted p-3 mb-0">暂无集群节点信息</p>';
        return;
    }

    body.innerHTML = `<table class="table table-sm mb-0">
        <thead><tr><th>Host</th><th>Port</th><th>角色</th></tr></thead>
        <tbody>${servers.map((s) => `
            <tr>
                <td>${escapeHtml(s.host || '')}</td>
                <td>${escapeHtml(String(s.port || ''))}</td>
                <td>${s.role ? `<span class="badge bg-info">${escapeHtml(s.role)}</span>` : '<span class="text-muted">-</span>'}</td>
            </tr>
        `).join('')}</tbody>
    </table>`;
}

// 加载节点信息
function loadNode(path) {
    if (!path) {
        path = document.getElementById('node-path-input').value.trim();
    }
    if (!path) path = '/';

    // 更新输入框
    document.getElementById('node-path-input').value = path;

    // 加载子节点
    fetch(BASE_URL + `/zookeeper/api/children?path=${encodeURIComponent(path)}`)
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('children-list');
            list.innerHTML = '';
            if (data.children && data.children.length > 0) {
                // 上一级
                if (path !== '/') {
                    const parent = path.substring(0, path.lastIndexOf('/')) || '/';
                    list.innerHTML += `<a href="javascript:void(0)" class="d-block py-1 text-muted" onclick="loadNode('${parent}')">
                        <i class="bi bi-arrow-up"></i> ..</a>`;
                }
                data.children.forEach(child => {
                    const childPath = path === '/' ? '/' + child : path + '/' + child;
                    list.innerHTML += `<a href="javascript:void(0)" class="d-block py-1 node-link" onclick="loadNode('${childPath}')">
                        <i class="bi bi-folder2"></i> ${child}</a>`;
                });
            } else {
                list.innerHTML = '<p class="text-muted">无子节点</p>';
            }
        })
        .catch(err => {
            document.getElementById('children-list').innerHTML = `<p class="text-danger">加载失败: ${err}</p>`;
        });

    // 加载节点详情
    fetch(BASE_URL + `/zookeeper/api/node?path=${encodeURIComponent(path)}`)
        .then(r => {
            if (!r.ok) return r.json().then(d => Promise.reject(d.error));
            return r.json();
        })
        .then(data => {
            const detail = document.getElementById('node-detail');
            let html = `<table class="table table-sm table-borderless mb-0">
                <tr><th style="width:120px">路径</th><td><code>${data.path}</code></td></tr>
                <tr><th>版本</th><td>${data.version}</td></tr>
                <tr><th>子节点数</th><td>${data.num_children}</td></tr>
                <tr><th>cZxid</th><td>${data.czxid}</td></tr>
                <tr><th>mZxid</th><td>${data.mzxid}</td></tr>
                <tr><th>创建时间</th><td>${new Date(data.ctime).toLocaleString()}</td></tr>
                <tr><th>修改时间</th><td>${new Date(data.mtime).toLocaleString()}</td></tr>
            </table>`;

            if (data.value) {
                html += `<hr><h6>数据</h6><pre class="bg-light p-2 rounded" style="max-height:200px;overflow:auto">${escapeHtml(data.value)}</pre>`;
            }
            detail.innerHTML = html;
        })
        .catch(err => {
            document.getElementById('node-detail').innerHTML = `<p class="text-danger">${err}</p>`;
        });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeJs(text) {
    return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

async function refreshZkPage() {
    try {
        await loadZkConnections();
        const status = await fetch(`${BASE_URL}/zookeeper/api/status`).then((r) => r.json());
        renderZkStatus(status);
        if (status.connected) {
            await Promise.all([loadZkKeyNodes(), loadZkServers()]);
            loadNode(document.getElementById('node-path-input').value.trim() || '/');
        } else {
            setZkLazyMessage('未连接，暂不加载明细');
            document.getElementById('children-list').innerHTML = '<p class="text-muted">未连接</p>';
            document.getElementById('node-detail').innerHTML = '<p class="text-muted">未连接</p>';
        }
    } catch (err) {
        document.getElementById('zk-status-body').innerHTML = `<p class="text-danger mb-0">加载失败: ${escapeHtml(String(err))}</p>`;
        setZkLazyMessage('加载失败');
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    await refreshZkPage();
});
</script>
{% endblock %}
