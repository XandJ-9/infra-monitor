{% extends "base.html" %}
{% block title %}Elasticsearch 监控 - Infra Monitor{% endblock %}

{% block content %}
<h4 class="mb-3"><i class="bi bi-search"></i> Elasticsearch 监控</h4>

<!-- 连接管理 -->
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>连接管理</span>
        <button class="btn btn-sm btn-outline-secondary" type="button" onclick="resetEsConnectionForm()">
            <i class="bi bi-plus-lg"></i> 新增连接
        </button>
    </div>
    <div class="card-body">
        <div class="row g-3 align-items-end mb-3">
            <div class="col-md-5">
                <label class="form-label">当前集群</label>
                <select class="form-select" id="es-active-connection" onchange="setActiveEsConnection(this.value)"></select>
            </div>
            <div class="col-md-7">
                <div id="es-connection-summary" class="text-muted"></div>
            </div>
        </div>
        <form class="row g-2 align-items-end" id="es-connection-form" onsubmit="saveEsConnection(event)">
            <input type="hidden" id="es-connection-id">
            <div class="col-md-2">
                <label class="form-label">名称</label>
                <input type="text" class="form-control" id="es-connection-name" placeholder="生产集群">
            </div>
            <div class="col-md-3">
                <label class="form-label">连接地址</label>
                <input type="url" class="form-control" id="es-connection-url" placeholder="https://es.example.com:9200" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">账号</label>
                <input type="text" class="form-control" id="es-connection-username" autocomplete="username">
            </div>
            <div class="col-md-2">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="es-connection-password" autocomplete="current-password" placeholder="留空保留原密码">
            </div>
            <div class="col-md-2">
                <label class="form-label">超时（秒）</label>
                <input type="number" class="form-control" id="es-connection-timeout" min="1" max="120" value="10">
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary" title="保存">
                    <i class="bi bi-save"></i>
                </button>
            </div>
        </form>
        <div id="es-connections-table" class="table-responsive mt-3"></div>
    </div>
</div>

<!-- 状态概览 -->
<div class="row g-3 mb-3">
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header">连接状态</div>
            <div id="es-status-body" class="card-body">
                <p class="text-muted mb-0">
                    <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                    正在加载连接状态...
                </p>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card h-100">
            <div class="card-header">集群健康</div>
            <div id="es-health-body" class="card-body">
                <p class="text-muted mb-0">连接状态确认后加载健康信息</p>
            </div>
        </div>
    </div>
</div>

<!-- 文档查询 -->
<div class="card mb-3">
    <div class="card-header">
        <i class="bi bi-search"></i> 文档查询
    </div>
    <div class="card-body">
        <form id="es-search-form" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label for="es-search-index" class="form-label">索引</label>
                <input class="form-control" id="es-search-index" list="es-index-options"
                       placeholder="infra-monitor-demo" required disabled>
                <datalist id="es-index-options"></datalist>
            </div>
            <div class="col-md-6">
                <label for="es-search-query" class="form-label">查询语句</label>
                <input class="form-control" id="es-search-query"
                       placeholder='message:"infra-monitor 可查询测试数据"' disabled>
            </div>
            <div class="col-md-2">
                <label for="es-search-size" class="form-label">返回数量</label>
                <input class="form-control" id="es-search-size" type="number" min="1" max="100" value="10" disabled>
            </div>
            <div class="col-md-1 d-grid">
                <button id="es-search-submit" class="btn btn-primary" type="submit" disabled>
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
        <div id="es-search-status" class="small text-muted mt-3">连接成功后可查询文档。</div>
        <div id="es-search-results" class="table-responsive mt-2"></div>
    </div>
</div>

<!-- 节点列表 -->
<div class="card mb-3">
    <div class="card-header">
        <i class="bi bi-hdd-network"></i> 节点列表
        <span id="es-nodes-count" class="badge bg-secondary ms-2">-</span>
    </div>
    <div id="es-nodes-body" class="card-body p-0">
        <p class="text-muted p-3 mb-0">连接状态确认后加载节点信息</p>
    </div>
</div>

<!-- 索引列表 -->
<div class="card mb-3">
    <div class="card-header">
        <i class="bi bi-collection"></i> 索引列表
        <span id="es-indices-count" class="badge bg-secondary ms-2">-</span>
    </div>
    <div id="es-indices-body" class="card-body p-0">
        <p class="text-muted p-3 mb-0">连接状态确认后加载索引信息</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let esConnections = [];
let esActiveStatus = null;

function escapeJs(text) {
    return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

async function fetchEsApi(path, options) {
    let response = await fetch(`${BASE_URL}${path}`, options);
    if (response.status === 404 && BASE_URL) {
        response = await fetch(path, options);
    }
    return response;
}

async function fetchEsJson(path, options) {
    const response = await fetchEsApi(path, options);
    return response.json();
}

async function loadEsConnections() {
    const data = await fetchEsJson('/elasticsearch/api/connections');
    esConnections = data.connections || [];
    renderEsConnections(data.active);
}

function renderEsConnections(activeId) {
    const select = document.getElementById('es-active-connection');
    select.innerHTML = esConnections.map((conn) => `
        <option value="${escapeHtml(conn.id)}" ${conn.id === activeId ? 'selected' : ''}>
            ${escapeHtml(formatEsConnectionOption(conn, activeId))}
        </option>
    `).join('');

    const active = esConnections.find((conn) => conn.id === activeId) || esConnections[0];
    document.getElementById('es-connection-summary').innerHTML = active
        ? `<strong>${escapeHtml(active.name)}</strong> <code>${escapeHtml(active.url)}</code>
           ${active.id === activeId && esActiveStatus?.cluster ? `<span class="badge bg-primary ms-2">${escapeHtml(esActiveStatus.cluster)}</span>` : ''}
           ${active.username ? `<span class="badge bg-info ms-2">${escapeHtml(active.username)}</span>` : ''}
           ${active.has_password ? '<span class="badge bg-secondary ms-1">已配置密码</span>' : ''}`
        : '<span class="text-danger">暂无连接配置</span>';

    const table = document.getElementById('es-connections-table');
    if (!esConnections.length) {
        table.innerHTML = '<p class="text-muted mb-0">暂无连接配置</p>';
        return;
    }
    table.innerHTML = `<table class="table table-sm align-middle mb-0">
        <thead><tr><th>名称</th><th>地址</th><th>账号</th><th>密码</th><th>超时</th><th class="text-end">操作</th></tr></thead>
        <tbody>${esConnections.map((conn) => `
            <tr>
                <td>
                    ${conn.active ? '<span class="badge bg-primary me-1">当前</span>' : ''}
                    ${escapeHtml(conn.name)}
                </td>
                <td><code>${escapeHtml(conn.url)}</code></td>
                <td>${conn.username ? escapeHtml(conn.username) : '<span class="text-muted">-</span>'}</td>
                <td>${conn.has_password ? '<span class="badge bg-secondary">已配置</span>' : '<span class="text-muted">-</span>'}</td>
                <td>${escapeHtml(String(conn.timeout))}s</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" type="button" title="切换" onclick="setActiveEsConnection('${escapeJs(conn.id)}')" ${conn.active ? 'disabled' : ''}>
                        <i class="bi bi-check2-circle"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" type="button" title="编辑" onclick="editEsConnection('${escapeJs(conn.id)}')">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" type="button" title="删除" onclick="deleteEsConnection('${escapeJs(conn.id)}')" ${esConnections.length <= 1 ? 'disabled' : ''}>
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('')}</tbody>
    </table>`;
}

function formatEsConnectionOption(conn, activeId) {
    const isActive = conn.id === activeId;
    const cluster = isActive && esActiveStatus?.cluster ? ` / ${esActiveStatus.cluster}` : '';
    return `${conn.name}${cluster} (${conn.url})`;
}

function resetEsConnectionForm() {
    document.getElementById('es-connection-id').value = '';
    document.getElementById('es-connection-name').value = '';
    document.getElementById('es-connection-url').value = '';
    document.getElementById('es-connection-username').value = '';
    document.getElementById('es-connection-password').value = '';
    document.getElementById('es-connection-timeout').value = '10';
    document.getElementById('es-connection-url').focus();
}

function editEsConnection(id) {
    const conn = esConnections.find((item) => item.id === id);
    if (!conn) return;
    document.getElementById('es-connection-id').value = conn.id;
    document.getElementById('es-connection-name').value = conn.name || '';
    document.getElementById('es-connection-url').value = conn.url || '';
    document.getElementById('es-connection-username').value = conn.username || '';
    document.getElementById('es-connection-password').value = '';
    document.getElementById('es-connection-timeout').value = conn.timeout || 10;
}

async function saveEsConnection(event) {
    event.preventDefault();
    const password = document.getElementById('es-connection-password').value;
    const payload = {
        id: document.getElementById('es-connection-id').value.trim(),
        name: document.getElementById('es-connection-name').value.trim(),
        url: document.getElementById('es-connection-url').value.trim(),
        username: document.getElementById('es-connection-username').value.trim(),
        timeout: Number(document.getElementById('es-connection-timeout').value || 10),
    };
    if (password || !payload.id) {
        payload.password = password;
    }
    const response = await fetchEsApi('/elasticsearch/api/connections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '保存失败');
        return;
    }
    resetEsConnectionForm();
    await refreshEsPage();
}

async function setActiveEsConnection(id) {
    if (!id) return;
    const response = await fetchEsApi('/elasticsearch/api/connections/active', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '切换失败');
        return;
    }
    await refreshEsPage();
}

async function deleteEsConnection(id) {
    if (!confirm('删除这个 Elasticsearch 连接？')) return;
    const response = await fetchEsApi(`/elasticsearch/api/connections/${encodeURIComponent(id)}`, {
        method: 'DELETE',
    });
    if (!response.ok) {
        const data = await response.json();
        alert(data.error || '删除失败');
        return;
    }
    await refreshEsPage();
}

function renderEsStatus(info) {
    const body = document.getElementById('es-status-body');
    if (!info.connected) {
        body.innerHTML = `
            <span class="badge bg-danger fs-6">未连接</span>
            <p class="mt-2 text-danger mb-0">${escapeHtml(info.error || '无法连接')}</p>`;
        return;
    }

    body.innerHTML = `
        <span class="badge bg-success fs-6">已连接</span>
        <p class="mt-2 mb-1"><strong>当前集群：</strong>${escapeHtml(info.metrics?.['连接名称'] || info.cluster || '已连接')}</p>
        <p class="mb-1"><strong>ES 集群：</strong>${escapeHtml(info.cluster || '-')}</p>
        <p class="mb-0"><strong>版本：</strong>${escapeHtml(info.version || '-')}</p>`;
}

function setEsLazyMessage(message) {
    document.getElementById('es-health-body').innerHTML = `<p class="text-muted mb-0">${message}</p>`;
    document.getElementById('es-nodes-body').innerHTML = `<p class="text-muted p-3 mb-0">${message}</p>`;
    document.getElementById('es-indices-body').innerHTML = `<p class="text-muted p-3 mb-0">${message}</p>`;
    document.getElementById('es-nodes-count').textContent = '-';
    document.getElementById('es-indices-count').textContent = '-';
}

function renderEsHealth(health) {
    const body = document.getElementById('es-health-body');
    if (!health || !Object.keys(health).length) {
        body.innerHTML = '<p class="text-muted mb-0">无法获取集群健康信息</p>';
        return;
    }

    const status = health.status || 'unknown';
    const statusClass = status === 'green' ? 'bg-success' : status === 'yellow' ? 'bg-warning text-dark' : 'bg-danger';
    body.innerHTML = `<div class="d-flex gap-3 flex-wrap">
        <div class="text-center"><div class="fs-4"><span class="badge ${statusClass}">${escapeHtml(status.toUpperCase())}</span></div><small class="text-muted">状态</small></div>
        <div class="text-center"><div class="fs-4">${escapeHtml(String(health.number_of_nodes || '-'))}</div><small class="text-muted">节点数</small></div>
        <div class="text-center"><div class="fs-4">${escapeHtml(String(health.active_shards || '-'))}</div><small class="text-muted">活跃分片</small></div>
        <div class="text-center"><div class="fs-4">${escapeHtml(String(health.active_primary_shards || '-'))}</div><small class="text-muted">主分片</small></div>
        <div class="text-center"><div class="fs-4 ${health.unassigned_shards ? 'text-danger' : ''}">${escapeHtml(String(health.unassigned_shards || 0))}</div><small class="text-muted">未分配分片</small></div>
        <div class="text-center"><div class="fs-4">${escapeHtml(String(health.number_of_data_nodes || '-'))}</div><small class="text-muted">数据节点</small></div>
    </div>`;
}

function renderEsNodes(nodes) {
    const body = document.getElementById('es-nodes-body');
    const count = document.getElementById('es-nodes-count');
    count.className = 'badge bg-info ms-2';
    count.textContent = nodes.length;
    if (!nodes.length) {
        body.innerHTML = '<p class="text-muted p-3 mb-0">暂无节点信息</p>';
        return;
    }

    body.innerHTML = `<table class="table table-sm table-hover mb-0">
        <thead><tr><th>名称</th><th>Host</th><th>角色</th><th>Heap</th><th>RAM</th><th>负载</th></tr></thead>
        <tbody>${nodes.map((n) => {
            const heap = /^\d+$/.test(n.heap_percent || '') ? Number(n.heap_percent) : 0;
            const progressClass = heap > 85 ? 'bg-danger' : heap > 70 ? 'bg-warning' : 'bg-success';
            return `<tr>
                <td><strong>${escapeHtml(n.name || '')}</strong></td>
                <td>${escapeHtml(n.host || '')}</td>
                <td>${escapeHtml(n.role || '')}</td>
                <td><div class="progress" style="height: 18px; min-width: 60px;"><div class="progress-bar ${progressClass}" style="width: ${heap}%">${heap}%</div></div></td>
                <td>${escapeHtml(String(n.ram_percent || ''))}%</td>
                <td>${escapeHtml(n.load || '')}</td>
            </tr>`;
        }).join('')}</tbody>
    </table>`;
}

function renderEsIndices(indices) {
    const body = document.getElementById('es-indices-body');
    const count = document.getElementById('es-indices-count');
    const options = document.getElementById('es-index-options');
    count.className = 'badge bg-info ms-2';
    count.textContent = indices.length;
    options.innerHTML = indices.map((i) => `<option value="${escapeHtml(i.name || '')}"></option>`).join('');

    if (!indices.length) {
        body.innerHTML = '<p class="text-muted p-3 mb-0">暂无索引信息</p>';
        return;
    }

    body.innerHTML = `<div class="table-responsive">
        <table class="table table-sm table-hover mb-0">
            <thead><tr><th>名称</th><th>健康</th><th>状态</th><th>文档数</th><th>大小</th><th>主分片</th><th>副本</th></tr></thead>
            <tbody>${indices.map((i) => `<tr>
                <td><code>${escapeHtml(i.name || '')}</code></td>
                <td>${healthBadge(i.health || 'unknown')}</td>
                <td>${escapeHtml(i.status || '')}</td>
                <td>${escapeHtml(String(i.docs_count || 0))}</td>
                <td>${escapeHtml(i.store_size || '')}</td>
                <td>${escapeHtml(String(i.primaries || 0))}</td>
                <td>${escapeHtml(String(i.replicas || 0))}</td>
            </tr>`).join('')}</tbody>
        </table>
    </div>`;
}

function setEsSearchEnabled(enabled) {
    ['es-search-index', 'es-search-query', 'es-search-size', 'es-search-submit'].forEach((id) => {
        document.getElementById(id).disabled = !enabled;
    });
    document.getElementById('es-search-status').textContent = enabled
        ? '输入索引后可查询文档，查询语句留空时返回最新文档。'
        : '连接成功后可查询文档。';
}

async function loadEsDetails() {
    setEsLazyMessage('正在加载明细...');
    const [health, nodes, indices] = await Promise.all([
        fetchEsJson('/elasticsearch/api/health'),
        fetchEsJson('/elasticsearch/api/nodes'),
        fetchEsJson('/elasticsearch/api/indices'),
    ]);
    renderEsHealth(health);
    renderEsNodes(nodes);
    renderEsIndices(indices);
    setEsSearchEnabled(true);
}

(() => {
    const form = document.getElementById('es-search-form');
    if (!form) {
        return;
    }

    const indexInput = document.getElementById('es-search-index');
    const queryInput = document.getElementById('es-search-query');
    const sizeInput = document.getElementById('es-search-size');
    const statusEl = document.getElementById('es-search-status');
    const resultsEl = document.getElementById('es-search-results');

    function renderHits(hits) {
        resultsEl.replaceChildren();
        if (!hits.length) {
            const empty = document.createElement('div');
            empty.className = 'alert alert-secondary mb-0';
            empty.textContent = '没有匹配文档';
            resultsEl.appendChild(empty);
            return;
        }

        const table = document.createElement('table');
        table.className = 'table table-sm table-hover align-middle mb-0';
        table.innerHTML = '<thead><tr><th>索引</th><th>ID</th><th>Score</th><th>Source</th></tr></thead>';
        const tbody = document.createElement('tbody');
        for (const hit of hits) {
            const row = document.createElement('tr');
            const indexCell = document.createElement('td');
            const idCell = document.createElement('td');
            const scoreCell = document.createElement('td');
            const sourceCell = document.createElement('td');
            const code = document.createElement('code');
            const pre = document.createElement('pre');

            code.textContent = hit.index || '';
            indexCell.appendChild(code);
            idCell.textContent = hit.id || '';
            scoreCell.textContent = hit.score == null ? '-' : hit.score;
            pre.className = 'mb-0 small';
            pre.textContent = JSON.stringify(hit.source || {}, null, 2);
            sourceCell.appendChild(pre);

            row.append(indexCell, idCell, scoreCell, sourceCell);
            tbody.appendChild(row);
        }
        table.appendChild(tbody);
        resultsEl.appendChild(table);
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const index = indexInput.value.trim();
        const query = queryInput.value.trim();
        const size = sizeInput.value || '10';
        if (!index) {
            indexInput.focus();
            return;
        }

        statusEl.className = 'small text-muted mt-3';
        statusEl.textContent = '查询中...';
        resultsEl.replaceChildren();

        const params = new URLSearchParams({ index, q: query, size });
        const response = await fetchEsApi(`/elasticsearch/api/search?${params.toString()}`);
        const data = await response.json();
        if (data.error) {
            statusEl.className = 'small text-danger mt-3';
            statusEl.textContent = data.error;
            renderHits([]);
            return;
        }

        statusEl.className = 'small text-muted mt-3';
        statusEl.textContent = `共命中 ${data.total || 0} 条，显示 ${data.hits.length} 条`;
        renderHits(data.hits || []);
    });

    document.addEventListener('DOMContentLoaded', refreshEsPage);
})();

async function refreshEsPage() {
    try {
        await loadEsConnections();
        const status = await fetchEsJson('/elasticsearch/api/status');
        esActiveStatus = status.connected ? status : null;
        const activeId = document.getElementById('es-active-connection').value;
        renderEsConnections(activeId);
        renderEsStatus(status);
        if (status.connected) {
            await loadEsDetails();
        } else {
            setEsLazyMessage('未连接，暂不加载明细');
            setEsSearchEnabled(false);
        }
    } catch (err) {
        document.getElementById('es-status-body').innerHTML = `<p class="text-danger mb-0">加载失败: ${escapeHtml(String(err))}</p>`;
        setEsLazyMessage('加载失败');
        setEsSearchEnabled(false);
    }
}
</script>
{% endblock %}
