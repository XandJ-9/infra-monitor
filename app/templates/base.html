<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Infra Monitor{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="{{ request.scope.get('root_path', '') }}/static/css/style.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top app-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ request.scope.get('root_path', '') }}/">
                <i class="bi bi-diagram-3"></i> Infra Monitor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' or request.url.path == root_path + '/' %}active{% endif %}" href="{{ root_path }}/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/zookeeper' in request.url.path %}active{% endif %}" href="{{ root_path }}/zookeeper/">
                            <i class="bi bi-tree"></i> ZooKeeper
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/kafka' in request.url.path %}active{% endif %}" href="{{ root_path }}/kafka/">
                            <i class="bi bi-lightning"></i> Kafka
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/elasticsearch' in request.url.path and '/config' not in request.url.path %}active{% endif %}" href="{{ root_path }}/elasticsearch/">
                            <i class="bi bi-search"></i> Elasticsearch
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/files' in request.url.path %}active{% endif %}" href="{{ root_path }}/files/">
                            <i class="bi bi-folder2-open"></i> File Browser
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/config' in request.url.path %}active{% endif %}" href="{{ root_path }}/elasticsearch/config">
                            <i class="bi bi-gear"></i> Config
                        </a>
                    </li>
                </ul>
                <div class="ms-auto">
                    <button class="btn btn-outline-light btn-sm" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 全局 BASE_URL -->
    <script>window.BASE_URL = '{{ root_path }}';</script>
    <!-- 自定义 JS -->
    <script src="{{ root_path }}/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
