{% extends "base.html" %}
{% block title %}仪表盘 - Infra Monitor{% endblock %}

{% block content %}
<h4 class="mb-3">基础设施监控仪表盘</h4>

<!-- 自动刷新提示 -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <span class="text-muted">自动刷新间隔：{{ refresh_interval }}s</span>
    <button class="btn btn-sm btn-outline-primary" onclick="refreshDashboard()">
        <i class="bi bi-arrow-clockwise"></i> 立即刷新
    </button>
</div>

<!-- 组件卡片 -->
<div class="row g-3" id="dashboard-cards">
    <!-- ZooKeeper 卡片 -->
    <div class="col-md-4">
        <div class="card component-card h-100" data-component="zookeeper">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-tree"></i> ZooKeeper</span>
                <span class="status-dot status-loading"></span>
            </div>
            <div class="card-body component-card-body">
                <p class="text-muted mb-0">
                    <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                    正在加载连接状态...
                </p>
            </div>
            <div class="card-footer text-center">
                <a href="{{ root_path }}/zookeeper/" class="btn btn-sm btn-outline-primary">查看详情</a>
            </div>
        </div>
    </div>

    <!-- Kafka 卡片 -->
    <div class="col-md-4">
        <div class="card component-card h-100" data-component="kafka">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-lightning"></i> Kafka</span>
                <span class="status-dot status-loading"></span>
            </div>
            <div class="card-body component-card-body">
                <p class="text-muted mb-0">
                    <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                    正在加载连接状态...
                </p>
            </div>
            <div class="card-footer text-center">
                <a href="{{ root_path }}/kafka/" class="btn btn-sm btn-outline-primary">查看详情</a>
            </div>
        </div>
    </div>

    <!-- Elasticsearch 卡片 -->
    <div class="col-md-4">
        <div class="card component-card h-100" data-component="elasticsearch">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-search"></i> Elasticsearch</span>
                <span class="status-dot status-loading"></span>
            </div>
            <div class="card-body component-card-body">
                <p class="text-muted mb-0">
                    <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                    正在加载连接状态...
                </p>
            </div>
            <div class="card-footer text-center">
                <a href="{{ root_path }}/elasticsearch/" class="btn btn-sm btn-outline-primary">查看详情</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 自动刷新
let refreshInterval = {{ refresh_interval }};
let refreshTimer = setInterval(refreshDashboard, refreshInterval * 1000);
document.addEventListener('DOMContentLoaded', refreshDashboard);

function refreshDashboard() {
    fetch(BASE_URL + '/api/dashboard/status')
        .then(r => {
            if (!r.ok) {
                throw new Error(`HTTP ${r.status}`);
            }
            return r.json();
        })
        .then(data => {
            updateCard('zookeeper', data.zookeeper);
            updateCard('kafka', data.kafka);
            updateCard('elasticsearch', data.elasticsearch);
        })
        .catch(err => console.error('刷新失败:', err));
}

function updateCard(component, info) {
    const card = document.querySelector(`.component-card[data-component="${component}"]`);
    if (!card || !info) {
        return;
    }

    const dot = card.querySelector('.status-dot');
    if (dot) {
        dot.classList.toggle('status-ok', Boolean(info.connected));
        dot.classList.toggle('status-error', !info.connected);
        dot.classList.remove('status-loading');
    }

    const body = card.querySelector('.component-card-body');
    if (!body) {
        return;
    }

    if (!info.connected) {
        body.innerHTML = `<p class="text-danger">${escapeHtml(info.error || '未连接')}</p>`;
        return;
    }

    const rows = [
        `<p class="mb-1"><strong>集群：</strong>${escapeHtml(info.cluster || '已连接')}</p>`,
        `<p class="mb-1"><strong>版本：</strong>${escapeHtml(info.version || '-')}</p>`,
    ];

    Object.entries(info.metrics || {}).forEach(([key, value]) => {
        if (key === 'status') {
            rows.push(`<p class="mb-1 small text-muted">${healthBadge(String(value))}</p>`);
        } else {
            rows.push(`<p class="mb-1 small text-muted">${escapeHtml(key)}: ${escapeHtml(String(value))}</p>`);
        }
    });

    body.innerHTML = rows.join('');
}
</script>
{% endblock %}
